; AfterShell DocPortal — PHP runtime, PATCHED control (PHP 8.4.28 semantics).
; The ONLY functional difference from config/99-portal.ini is the
; session.upload_progress.enabled line below; every other line is identical.
;
; Upstream fact: the way PHP 8.4.28 fixes CVE-2026-126714 is by shipping
; upload progress OFF by default (verified on these very images:
; `php -n` built-in default is "1" on 8.4.27 and "0" on 8.4.28). An ini that
; explicitly turns the feature back ON keeps you vulnerable — a very common
; ops reality. The control container restores the patch semantics with an
; explicit 0; the vulnerable container keeps the explicit 1.
; Consequence: the upload tick never writes to the session file, so the
; carrier upload_progress record is never created and the attack chain
; breaks at step 1 (deterministic miss, not a race).
expose_php = 0
memory_limit = 256M
max_execution_time = 0
max_input_time = -1
post_max_size = 128M
upload_max_filesize = 100M

; session engine: files handler + php serializer + upload progress (RFC1867)
session.save_handler = files
session.serialize_handler = php
session.upload_progress.enabled = 0
session.upload_progress.cleanup = 1
session.upload_progress.prefix = upload_progress_
session.upload_progress.freq = 1%, 1024
session.upload_progress.min_freq = 0.001
session.gc_probability = 0
session.use_strict_mode = 1
