# AfterShell DocPortal — Apache hardening/tuning (loaded after security.conf)
ServerTokens Prod
ServerSignature Off
LimitRequestBody 0
LimitRequestFieldSize 131072
TraceEnable Off

<IfModule mpm_prefork_module>
    StartServers          2
    MinSpareServers       2
    MaxSpareServers       5
    MaxRequestWorkers    32
    MaxConnectionsPerChild 1000
</IfModule>
